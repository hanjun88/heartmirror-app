[pytest]
markers =
    engine_available: Tests that exercise the chat route when the xinjing engine is available (non-SAFE_DEGRADED path)
    engine_contract: Real-engine contract tests for arbitrate() — only run when XINJING_ENGINE_PATH points to a real, importable engine
    e2e: Real three-repo E2E (heartmirror + engine lunar/natal + Provider HTTP) — only run in the dedicated CI job; never skipped

